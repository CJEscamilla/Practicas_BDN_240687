<script>
'use strict';
const DB=JSON.parse(document.getElementById('schema-data').textContent);
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', W=390, HH=57,RH=31,FH=33;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString('en-US');
const state={x:0,y:0,z:1,filter:'all',query:'',types:true,collapsed:new Set(),selected:null,hover:null,key:null,positions:{},visible:[],layout:'lr'};
const nodes=new Map(),byName=new Map(DB.tables.map(t=>[t.name,t]));
let miniBounds=null,miniScale=1,drag=null,toastTimer,edgeGeometry=[];
const sv=(tag,attrs={},text)=>{const el=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el};
function badges(c){return [['pk','PK'],['fk','FK'],['uq','UQ'],['nn','NN'],['ai','AI'],['def','DEF']].filter(([k])=>k==='def'?c.default!==null:c[k]).map(([k,s])=>`<span class="badge ${k}" title="${esc(k==='def'?'DEFAULT '+c.default:s)}">${s}</span>`).join('')}
function height(t){return HH+FH+(state.collapsed.has(t.name)?0:t.columns.length*RH)}
function relationCount(name){return DB.relations.filter(r=>r.source===name||r.target===name).length}
function buildCards(){for(const t of DB.tables){const card=document.createElement('article');card.className='card';card.dataset.table=t.name;card.setAttribute('aria-label',t.name);card.tabIndex=0;
card.innerHTML=`<div class="table-head"><span class="entity" aria-hidden="true">▤</span><span class="table-name" title="${esc(t.name)}">${esc(t.name)}</span><span class="row-count ${t.rows?'':'empty'}">${fmt(t.rows)} filas</span><button class="icon-btn collapse-one" aria-label="Colapsar ${esc(t.name)}" title="Colapsar tabla">−</button><button class="icon-btn focus-one" aria-label="Enfocar ${esc(t.name)}" title="Enfocar tabla">⌖</button></div><div class="columns">${t.columns.map((c,i)=>`<div class="column" data-col="${i}" tabindex="0" role="button" aria-label="${esc(c.name+' '+c.type)}" title="${esc(c.definition)}"><span class="symbol ${c.pk?'pk':c.fk?'fk':''}">${c.pk?'◆':c.fk?'↗':'·'}</span><span class="col-name">${esc(c.name)}</span><span class="type" title="${esc(c.type)}">${esc(c.type)}</span><span class="badges">${badges(c)}</span></div>`).join('')}</div><div class="table-foot"><span>${t.columns.length} columnas</span><span>${t.indexes.length} índices</span><span>${relationCount(t.name)} relaciones</span><span>${esc(t.engine)}</span></div>`;
card.querySelector('.collapse-one').onclick=e=>{e.stopPropagation();toggleTable(t.name)};card.querySelector('.focus-one').onclick=e=>{e.stopPropagation();focusTable(t.name)};
card.onpointerover=e=>{if(drag)return;const row=e.target.closest('.column');state.hover={table:t.name,column:row?t.columns[Number(row.dataset.col)].name:null};highlight()};card.onpointerleave=()=>{state.hover=null;highlight()};
card.onclick=e=>{if(e.target.closest('button')||card.dataset.moved==='true')return;const row=e.target.closest('.column');select({table:t.name,column:row?t.columns[Number(row.dataset.col)].name:null})};
card.onkeydown=e=>{if(e.target.closest('button'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();const row=e.target.closest('.column');select({table:t.name,column:row?t.columns[Number(row.dataset.col)].name:null})}};
card.querySelector('.table-head').onpointerdown=e=>{if(e.button!==0||e.target.closest('button'))return;const p=state.positions[t.name];drag={kind:'card',name:t.name,startX:e.clientX,startY:e.clientY,x:p.x,y:p.y,moved:false,pointer:e.pointerId};card.dataset.moved='false';e.currentTarget.setPointerCapture(e.pointerId);e.preventDefault()};nodes.set(t.name,card);$('cards').append(card)}}
