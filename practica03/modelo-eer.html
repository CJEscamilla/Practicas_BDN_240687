<script>
const DB=JSON.parse(document.getElementById('database').textContent), tables=DB.tables, byName=new Map(tables.map(t=>[t.name,t]));
const fmt=new Intl.NumberFormat('es-MX'), state={zoom:1,x:80,y:72,targetX:80,targetY:72,targetScale:1,active:null,selected:null,filter:'all',userFilter:'',collapsed:new Set(),showTypes:true,isolated:null,query:'',orientation:'LR',tab:'overview',drawer:null};
const viewport=document.getElementById('viewport'), world=document.getElementById('world'), nodesEl=document.getElementById('nodes'), edgeSvg=document.getElementById('edges');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qid=s=>CSS.escape(s), pkCols=t=>new Set(t.primaryKey), fkCols=t=>new Set(t.foreignKeys.flatMap(f=>f.columns));
function role(c){return c.keys.includes('PK')?'pk':c.keys.includes('FK')?'fk':c.keys.includes('UQ')?'uq':'regular'}
function icon(t){return ({strong:'⬡',weak:'◈',associative:'⧉',subtype:'◎'})[t.eerType]||'⬡'}
function density(t){return t.recordCount>10000?'vhigh':t.recordCount>500?'high':''}
function attrHtml(t,c){const r=role(c), glyph={pk:'◆',fk:'↗',uq:'◇',regular:'·'}[r];const ispk=r==='pk';const badges=[c.nullable?'NULL':'NN',c.autoIncrement?'AI':'',c.default!==null&&c.default!==undefined?'DEF':''].filter(Boolean).map(x=>`<span class="badge ${x==='NN'?'nn':x==='AI'?'ai':x==='DEF'?'def':''}" title="${x==='DEF'?`DEFAULT ${esc(c.default)}`:x==='AI'?'AUTO_INCREMENT':x==='NN'?'NOT NULL':'Permite NULL'}">${x}</span>`).join('');let name=esc(c.name);if(state.query){const re=new RegExp(`(${state.query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig');name=name.replace(re,'<mark>$1</mark>')};return `<div class="colrow ${ispk?'pkrow':''}" data-table="${esc(t.name)}" data-column="${esc(c.name)}" data-role="${r}" title="${esc(c.rawDefinition)}"><span class="role ${r}">${glyph}</span><span class="colname">${name}</span><span class="typepill" title="${esc(c.type)}">${esc(c.type)}</span><span class="badges">${badges}</span></div>`}
function privilegeShort(p){return ({'ALL PRIVILEGES':'ALL','SELECT':'S','INSERT':'I','UPDATE':'U','DELETE':'D'})[p]||p}function nodeHtml(t){const access=(t.access||[]).filter(a=>!state.userFilter||a.user===state.userFilter).map(a=>`<span class="access-pill" title="${esc(a.privileges.join(', '))} via ${esc(a.via.join(', '))}${a.grantOption?' · WITH GRANT OPTION':''}">${esc(a.user)} · ${a.privileges.map(privilegeShort).join('/')}</span>`).join('');const cols=[...t.columns].sort((a,b)=>(a.keys.includes('PK')?-1:0)-(b.keys.includes('PK')?-1:0)||a.ordinal-b.ordinal);const nIdx=t.indexes.length, nRel=t.foreignKeys.length;return `<article class="node ${t.eerType}" data-node="${esc(t.name)}" id="node-${qid(t.name)}"><header class="nodehead"><span class="entity-icon">${icon(t)}</span><span class="node-title" title="${esc(t.name)}">${esc(t.name)}</span><span class="rowcount ${density(t)}">${fmt.format(t.recordCount)} filas</span><span class="headbtns"><button class="iconbtn collapse" title="Colapsar / expandir">⌄</button><button class="iconbtn isolate" title="Aislar subgrafo">◎</button><button class="iconbtn ddl" title="Ver DDL">⌘</button></span></header><div class="nbody"><div class="accessstrip">${access||'<span class="noaccess">Sin acceso</span>'}</div><div class="columns">${cols.map(c=>attrHtml(t,c)).join('')}</div></div><footer class="nodefoot"><span>${cols.length} columnas</span><span>${nIdx} índices</span><span>${nRel} relaciones</span><span>${esc(t.engine||'Motor —')}</span></footer></article>`}
function computeLayout(mode){const gap=73, dims=new Map(tables.map(t=>[t.name,Math.max(205,130+t.columns.length*28+(t.access?.length>4?18:0))])), parents=new Map(tables.map(t=>[t.name,[]]));for(const t of tables)for(const fk of t.foreignKeys)if(fk.referencesTable!==t.name&&parents.has(fk.referencesTable))parents.get(t.name).push(fk.referencesTable);let pos=new Map();if(mode==='RAD'){const cx=2200,cy=1750,rx=1562.5,ry=1125;tables.forEach((t,i)=>{const a=-Math.PI/2+2*Math.PI*i/tables.length;pos.set(t.name,{x:cx+Math.cos(a)*rx-195,y:cy+Math.sin(a)*ry-dims.get(t.name)/2})});return pos}const rank=new Map(tables.map(t=>[t.name,0]));for(let i=0;i<tables.length;i++)for(const t of tables)for(const p of parents.get(t.name))rank.set(t.name,Math.max(rank.get(t.name),Math.min(5,rank.get(p)+1)));const buckets=new Map();for(const t of tables){let r=rank.get(t.name);if(!buckets.has(r))buckets.set(r,[]);buckets.get(r).push(t)}const keys=[...buckets.keys()].sort((a,b)=>a-b);for(const r of keys){const group=buckets.get(r);let cursor=150;for(const t of group){if(mode==='LR')pos.set(t.name,{x:180+r*700,y:cursor});else pos.set(t.name,{x:180+cursor,y:150+r*812.5});cursor+=dims.get(t.name)+gap}}return pos}
let positions=computeLayout('LR');
function renderNodes(){nodesEl.innerHTML=tables.map(nodeHtml).join('');for(const t of tables){const el=document.getElementById('node-'+qid(t.name)),p=positions.get(t.name);el.style.left=p.x+'px';el.style.top=p.y+'px';el.classList.toggle('collapsed',state.collapsed.has(t.name));el.addEventListener('mouseenter',()=>activate(t.name));el.addEventListener('mouseleave',()=>activate(null));el.addEventListener('click',e=>{if(e.target.closest('button'))return;selectTable(t.name)});el.addEventListener('dblclick',()=>openDrawer(t.name));el.querySelector('.collapse').onclick=e=>{e.stopPropagation();state.collapsed.has(t.name)?state.collapsed.delete(t.name):state.collapsed.add(t.name);el.classList.toggle('collapsed');requestAnimationFrame(drawEdges)};el.querySelector('.isolate').onclick=e=>{e.stopPropagation();state.isolated=state.isolated===t.name?null:t.name;state.selected=state.isolated;updateHighlights();toast(state.isolated?`Subgrafo de ${t.name}`:'Vista completa')};el.querySelector('.ddl').onclick=e=>{e.stopPropagation();openDrawer(t.name,'ddl')};el.querySelectorAll('.colrow[data-role="fk"]').forEach(row=>row.addEventListener('click',e=>{e.stopPropagation();const fk=t.foreignKeys.find(f=>f.columns.includes(row.dataset.column));if(fk)jumpTo(fk.referencesTable,fk.referencesColumns[0])}));}applyFilters();drawEdges();drawMini()}
function edgePoints(fk,child,parent){const ce=document.getElementById('node-'+qid(child.name)),pe=document.getElementById('node-'+qid(parent.name));if(!ce||!pe)return null;const cRow=ce.querySelector(`.colrow[data-column="${CSS.escape(fk.columns[0])}"]`),pRow=pe.querySelector(`.colrow[data-column="${CSS.escape(fk.referencesColumns[0])}"]`);if(!cRow||!pRow)return null;const a=positions.get(child.name),b=positions.get(parent.name),cY=a.y+cRow.offsetTop+cRow.offsetHeight/2,pY=b.y+pRow.offsetTop+pRow.offsetHeight/2;const cX=a.x+(b.x>=a.x?ce.offsetWidth:0),pX=b.x+(a.x>=b.x?pe.offsetWidth:0);return {x1:cX,y1:cY,x2:pX,y2:pY}}
function drawEdges(){edgeSvg.innerHTML='';for(const child of tables)for(const fk of child.foreignKeys){const parent=byName.get(fk.referencesTable);if(!parent)continue;const p=edgePoints(fk,child,parent);if(!p)continue;const id=`edge-${safeEdge(child.name+'-'+fk.name)}`;let d;if(child.name===parent.name){const lane=Math.max(p.x1,p.x2)+34;d=`M ${p.x2} ${p.y2} H ${lane} V ${p.y1} H ${p.x1}`}else if(state.orientation==='LR'){const mid=(p.x1+p.x2)/2;d=`M ${p.x2} ${p.y2} H ${mid} V ${p.y1} H ${p.x1}`}else if(state.orientation==='TB'){const mid=(p.y1+p.y2)/2;d=`M ${p.x2} ${p.y2} V ${mid} H ${p.x1} V ${p.y1}`}else{const curve=Math.max(38,Math.abs(p.x1-p.x2)*.18);d=`M ${p.x2} ${p.y2} C ${p.x2+(p.x1<p.x2?-curve:curve)} ${p.y2}, ${p.x1+(p.x1<p.x2?curve:-curve)} ${p.y1}, ${p.x1} ${p.y1}`}const identifying=fk.columns.every(c=>child.primaryKey.includes(c));const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('class',`edge ${identifying?'identifying':''}`);path.setAttribute('stroke-dasharray',identifying?'none':'5 4');path.dataset.child=child.name;path.dataset.parent=parent.name;path.dataset.fk=fk.name;path.id=id;const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=`${child.name}.${fk.columns.join(', ')} → ${parent.name}.${fk.referencesColumns.join(', ')} · ON DELETE ${fk.onDelete} · ON UPDATE ${fk.onUpdate}`;path.append(title);const optional=fk.columns.some(n=>child.columns.find(c=>c.name===n)?.nullable);path.style.pointerEvents='stroke';path.onmouseenter=()=>{activate(child.name);edgeSvg.querySelectorAll(`[data-edge="${id}"]`).forEach(e=>e.style.opacity='1')};path.onmouseleave=()=>{activate(null);edgeSvg.querySelectorAll(`[data-edge="${id}"]`).forEach(e=>e.style.opacity='0')};edgeSvg.append(path);const mark=(x,y,txt)=>{const m=document.createElementNS('http://www.w3.org/2000/svg','text');m.setAttribute('x',x);m.setAttribute('y',y+4);m.setAttribute('text-anchor','middle');m.setAttribute('class','edge-mark');m.textContent=txt;edgeSvg.append(m)};mark(p.x1+(p.x2>=p.x1?14:-14),p.y1,optional?'o<':'|<');mark(p.x2+(p.x1>=p.x2?14:-14),p.y2,'||');const midx=(p.x1+p.x2)/2,midy=(p.y1+p.y2)/2;const text=`${child.name}.${fk.columns.join('+')} → ${parent.name}.${fk.referencesColumns.join('+')}`;const w=Math.min(260,Math.max(125,text.length*5.8+16));const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('x',midx-w/2);bg.setAttribute('y',midy-9);bg.setAttribute('width',w);bg.setAttribute('height',18);bg.setAttribute('rx',8);bg.setAttribute('class','edge-label-bg');bg.dataset.edge=id;edgeSvg.append(bg);const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x',midx);label.setAttribute('y',midy+3);label.setAttribute('text-anchor','middle');label.setAttribute('class','edge-label');label.dataset.edge=id;label.textContent=text;edgeSvg.append(label)}updateHighlights()}
function safeEdge(s){return s.replace(/[^\w-]/g,'_')}
let motionFrame=0;function transform(){world.style.transform=`translate3d(${state.x}px,${state.y}px,0) scale(${state.zoom})`;document.getElementById('zoomLabel').textContent=Math.round(state.zoom*100)+'%';world.classList.toggle('low-detail',state.zoom<.55);drawMini()}function animateCanvas(){motionFrame=0;const ease=.18,dx=state.targetX-state.x,dy=state.targetY-state.y,ds=state.targetScale-state.zoom;state.x+=dx*ease;state.y+=dy*ease;state.zoom+=ds*ease;const settled=Math.abs(dx)<.08&&Math.abs(dy)<.08&&Math.abs(ds)<.0005;if(settled){state.x=state.targetX;state.y=state.targetY;state.zoom=state.targetScale}transform();if(!settled)motionFrame=requestAnimationFrame(animateCanvas)}function moveCanvas(x,y,scale=state.targetScale){state.targetX=x;state.targetY=y;state.targetScale=Math.max(.1,Math.min(2,scale));if(!motionFrame)motionFrame=requestAnimationFrame(animateCanvas)}
function fit(){const shown=tables.filter(t=>!document.getElementById('node-'+qid(t.name)).classList.contains('hidden'));if(!shown.length)return;const xs=shown.map(t=>positions.get(t.name).x),ys=shown.map(t=>positions.get(t.name).y),xe=shown.map(t=>positions.get(t.name).x+370),ye=shown.map(t=>positions.get(t.name).y+Math.max(205,150+t.columns.length*28+(t.access?.length>4?18:0)));const minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xe),maxY=Math.max(...ye),r=viewport.getBoundingClientRect();const scale=Math.max(.1,Math.min(1.2,(r.width-100)/(maxX-minX),(r.height-150)/(maxY-minY)));moveCanvas((r.width-(maxX-minX)*scale)/2-minX*scale,(r.height-(maxY-minY)*scale)/2-minY*scale,scale)}
function zoomAt(z,px=viewport.clientWidth/2,py=viewport.clientHeight/2){z=Math.max(.1,Math.min(2,z));const wx=(px-state.targetX)/state.targetScale,wy=(py-state.targetY)/state.targetScale;moveCanvas(px-wx*z,py-wy*z,z)}
function drawMini(){const c=document.getElementById('minimap'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#0b111b';ctx.fillRect(0,0,c.width,c.height);const s=.055,ox=12,oy=10;for(const t of tables){const p=positions.get(t.name),x=ox+p.x*s,y=oy+p.y*s;ctx.fillStyle=t.eerType==='associative'?'#b07bff':t.recordCount>10000?'#44d5a0':t.recordCount?'#45d6e8':'#526176';ctx.fillRect(x,y,Math.max(4,390*s),Math.max(3,Math.min(24,t.columns.length*2.2)*s*4))}const r=viewport.getBoundingClientRect();ctx.strokeStyle='#e7f4ff';ctx.lineWidth=2;ctx.strokeRect(Math.max(0,(-state.x/state.zoom)*s+ox),Math.max(0,(-state.y/state.zoom)*s+oy),r.width/state.zoom*s,r.height/state.zoom*s)}
function activate(name){state.active=name;updateHighlights()}
function linked(name){const found=new Set(name?[name]:[]);if(name){const t=byName.get(name);for(const fk of t.foreignKeys)found.add(fk.referencesTable);for(const child of tables)if(child.foreignKeys.some(f=>f.referencesTable===name))found.add(child.name)}return found}
function updateHighlights(){const focus=state.isolated?linked(state.isolated):linked(state.active||state.selected);for(const el of nodesEl.querySelectorAll('.node')){const n=el.dataset.node;el.classList.toggle('selected',n===state.selected);el.classList.toggle('related',(state.active||state.selected||state.isolated)&&focus.has(n)&&n!==(state.active||state.selected||state.isolated));el.classList.toggle('faded',!!(state.active||state.selected||state.isolated)&&!focus.has(n));if(state.isolated)el.classList.toggle('hidden',!focus.has(n));}for(const e of edgeSvg.querySelectorAll('.edge')){const on=focus.has(e.dataset.child)&&focus.has(e.dataset.parent);e.classList.toggle('active',!!(state.active||state.selected||state.isolated)&&on);e.classList.toggle('faded',!!(state.active||state.selected||state.isolated)&&!on)}applyFilters()}
function applyFilters(){let count=0;const q=state.query.toLowerCase();for(const t of tables){const el=document.getElementById('node-'+qid(t.name));if(!el)continue;const matches=!q||t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q)||c.type.toLowerCase().includes(q));const f=state.filter==='all'||(state.filter==='data'?t.recordCount>0:t.recordCount===0);const iso=!state.isolated||linked(state.isolated).has(t.name);const userMatch=!state.userFilter||(t.access||[]).some(a=>a.user===state.userFilter);el.classList.toggle('hidden',!matches||!f||!iso||!userMatch);if(matches&&f&&iso&&userMatch)count++}document.getElementById('visibleCount').textContent=count;const empty=document.getElementById('emptyState');empty.textContent=count===0&&state.userFilter?`No hay tablas visibles para ${state.userFilter} con los filtros actuales.`:'No hay tablas que coincidan con los filtros actuales.';empty.hidden=count!==0;requestAnimationFrame(drawEdges)}
function selectTable(name){state.selected=name;state.isolated=null;updateHighlights();openDrawer(name)}
function jumpTo(name,column){const el=document.getElementById('node-'+qid(name));if(!el)return;state.isolated=null;state.selected=name;updateHighlights();const p=positions.get(name),r=viewport.getBoundingClientRect();const scale=Math.max(state.targetScale,.82);moveCanvas(r.width/2-(p.x+195)*scale,r.height/2-(p.y+140)*scale,scale);setTimeout(()=>{const row=el.querySelector(`.colrow[data-column="${CSS.escape(column)}"]`);if(row){row.classList.add('pulse');row.scrollIntoView({block:'nearest'});setTimeout(()=>row.classList.remove('pulse'),1300)}},620);toast(`Referencia a ${name}.${column}`)}
function openDrawer(name,tab='overview'){const t=byName.get(name);if(!t)return;state.drawer=name;document.getElementById('drawerTitle').textContent=t.name;document.getElementById('drawerSub').textContent=`${t.eerType.toUpperCase()} · ${t.engine||'motor no declarado'} · ${t.columns.length} columnas`;document.getElementById('drawer').classList.add('open');setTab(tab);}
function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));const t=byName.get(state.drawer);if(!t)return;const total=DB.metrics.recordCount,share=total?t.recordCount/total*100:0;let html='';if(tab==='overview'){html=`<div class="statgrid"><div class="stat"><label>REGISTROS EN RESPALDO</label><strong>${fmt.format(t.recordCount)}</strong></div><div class="stat"><label>PARTICIPACIÓN GLOBAL</label><strong>${share.toFixed(3)}%</strong></div><div class="stat"><label>ATRIBUTOS / ÍNDICES</label><strong>${t.columns.length} / ${t.indexes.length}</strong></div><div class="stat"><label>CLAVES FORÁNEAS</label><strong>${t.foreignKeys.length}</strong></div></div><div class="sharebar"><i style="width:${Math.min(100,share)}%"></i></div><div class="sectiontitle">Anatomía de columnas</div><table class="detailtable"><thead><tr><th>#</th><th>Columna</th><th>Tipo SQL</th><th>Reglas</th></tr></thead><tbody>${t.columns.map(c=>`<tr><td>${c.ordinal}</td><td><code>${esc(c.name)}</code>${c.comment?`<div>${esc(c.comment)}</div>`:''}</td><td><code>${esc(c.type)}</code></td><td>${c.keys.join(' · ')||'—'} · ${c.nullable?'NULL':'NOT NULL'}${c.autoIncrement?' · AUTO_INCREMENT':''}${c.default!==null&&c.default!==undefined?` · DEFAULT ${esc(c.default)}`:''}${c.onUpdate?` · ${esc(c.onUpdate)}`:''}</td></tr>`).join('')}</tbody></table><div class="sectiontitle">Índices completos</div>${t.indexes.map(i=>`<div class="indexcard">${esc(i.name||'—')} · ${esc(i.kind)}<small>${i.columns.map(esc).join(', ')}</small></div>`).join('')||'<div class="empty-note">Sin índices adicionales</div>'}<div class="sectiontitle">Integridad referencial</div>${t.foreignKeys.map(f=>`<div class="indexcard">${esc(f.name||'FOREIGN KEY')}<small>${esc(t.name)}.${esc(f.columns.join(', '))} → ${esc(f.referencesTable)}.${esc(f.referencesColumns.join(', '))}<br>ON DELETE ${esc(f.onDelete)} · ON UPDATE ${esc(f.onUpdate)}</small></div>`).join('')||'<div class="empty-note">Sin claves foráneas</div>'}<div class="sectiontitle">Metadatos de almacenamiento</div><div class="indexcard">ENGINE=${esc(t.engine||'—')} · CHARSET=${esc(t.charset||'—')} · COLLATE=${esc(t.collation||'—')}<small>${esc(t.tableOptions||'')}</small></div>${t.tableComment?`<div class="indexcard">Comentario: ${esc(t.tableComment)}</div>`:''}`}
else if(tab==='access'){const granted=new Set((t.access||[]).map(a=>a.user+'@'+a.host));const none=DB.accessControl.users.filter(u=>!granted.has(u.name+'@'+u.host));html=`<div class="sectiontitle">Privilegios de datos por cuenta</div>${(t.access||[]).map(a=>`<div class="indexcard"><strong>${esc(a.user)}@${esc(a.host)}</strong><small>${esc(a.privileges.join(', '))}<br>Otorgado por: ${esc(a.via.join(', '))}${a.roles.length?` · roles: ${esc(a.roles.join(', '))}`:''}${a.grantOption?' · WITH GRANT OPTION':''}</small></div>`).join('')||'<div class="empty-note">No hay acceso a los datos de esta tabla.</div>'}<div class="sectiontitle">Sin privilegios de datos asignados</div><div class="indexcard">${none.map(u=>`${esc(u.name)}@${esc(u.host)}`).join('<br>')||'Todas las cuentas listadas tienen acceso.'}</div><div class="empty-note">SHOW VIEW permite consultar metadatos de vistas; no concede SELECT sobre filas.</div>`}else if(tab==='ddl'){html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px"><span class="sectiontitle" style="margin:0">CREATE TABLE original</span><button class="toolbtn" id="copyDDL">Copiar</button></div><pre class="codebox">${esc(t.ddl)}</pre>`}
else {html=`<div class="sectiontitle">Primeras ${t.samples.length} filas disponibles en el dump</div>${t.samples.length?t.samples.map((row,i)=>`<div class="mono" style="margin:5px 0">Fila ${i+1}</div><pre class="samplebox">${esc(JSON.stringify(row.map(v=>v.replace(/\\r/g,'␍').replace(/\\n/g,'␊')),null,2))}</pre>`).join(''):'<div class="empty-note">No hay sentencias INSERT para esta tabla: 0 registros.</div>'}`}
document.getElementById('drawerContent').innerHTML=html;const cp=document.getElementById('copyDDL');if(cp)cp.onclick=async()=>{await navigator.clipboard.writeText(t.ddl);toast('DDL copiado')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1600)}
function makeExport(){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const visible=tables.filter(t=>!document.getElementById('node-'+qid(t.name)).classList.contains('hidden'));const maxX=Math.max(...visible.map(t=>positions.get(t.name).x+410)),maxY=Math.max(...visible.map(t=>positions.get(t.name).y+100+t.columns.length*28));svg.setAttribute('viewBox',`0 0 ${maxX+80} ${maxY+80}`);svg.setAttribute('xmlns',ns);const bg=document.createElementNS(ns,'rect');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill','#0b0f19');svg.append(bg);for(const c of tables)for(const fk of c.foreignKeys){const p=byName.get(fk.referencesTable);if(!p||!visible.includes(c)||!visible.includes(p))continue;const a=positions.get(c.name),b=positions.get(p.name),x1=a.x+390,y1=a.y+94+Math.max(0,c.columns.findIndex(x=>x.name===fk.columns[0]))*28,x2=b.x,y2=b.y+94+Math.max(0,p.columns.findIndex(x=>x.name===fk.referencesColumns[0]))*28,path=document.createElementNS(ns,'path');path.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke','#54d7e6');path.setAttribute('stroke-width','2');svg.append(path)}for(const t of visible){const p=positions.get(t.name),g=document.createElementNS(ns,'g');const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y);rect.setAttribute('width','390');rect.setAttribute('height',92+t.columns.length*28);rect.setAttribute('rx','12');rect.setAttribute('fill','#111b29');rect.setAttribute('stroke',t.eerType==='associative'?'#b07bff':'#35465c');g.append(rect);const add=(x,y,text,size,color,fam='sans-serif',weight='400')=>{const z=document.createElementNS(ns,'text');z.setAttribute('x',x);z.setAttribute('y',y);z.setAttribute('fill',color);z.setAttribute('font-size',size);z.setAttribute('font-family',fam);z.setAttribute('font-weight',weight);z.textContent=text;g.append(z)};add(p.x+14,p.y+27,`${icon(t)}  ${t.name}`,14,'#e5eef8','monospace','700');add(p.x+14,p.y+47,`${fmt.format(t.recordCount)} registros · ${t.eerType}`,10,'#56cfdb','monospace');t.columns.forEach((c,i)=>add(p.x+15,p.y+72+i*28,`${c.keys.includes('PK')?'◆':c.keys.includes('FK')?'↗':c.keys.includes('UQ')?'◇':'·'} ${c.name}   ${c.type}`,10,'#b6c8da','monospace'));svg.append(g)}return svg}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('exportSvg').onclick=()=>{const s=makeExport();download(new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}),'db_test-eer.svg')};document.getElementById('exportPng').onclick=()=>{const s=makeExport(),xml=new XMLSerializer().serializeToString(s),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const vb=s.viewBox.baseVal,c=document.createElement('canvas');c.width=vb.width*2;c.height=vb.height*2;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>download(b,'db_test-eer.png'));URL.revokeObjectURL(url)};img.src=url};
document.getElementById('orientation').onchange=e=>{state.orientation=e.target.value;positions=computeLayout(state.orientation);renderNodes();setTimeout(fit,20)};document.getElementById('fit').onclick=fit;document.getElementById('zoomIn').onclick=()=>zoomAt(state.targetScale*1.2);document.getElementById('zoomOut').onclick=()=>zoomAt(state.targetScale/1.2);document.getElementById('toggleTypes').onclick=e=>{state.showTypes=!state.showTypes;world.classList.toggle('hide-types',!state.showTypes);e.target.textContent=`Tipos ${state.showTypes?'✓':'—'}`};document.getElementById('collapseAll').onclick=e=>{const all=state.collapsed.size!==tables.length;state.collapsed=all?new Set(tables.map(t=>t.name)):new Set();nodesEl.querySelectorAll('.node').forEach(n=>n.classList.toggle('collapsed',all));e.target.textContent=all?'Expandir':'Colapsar';drawEdges()};document.getElementById('drawerClose').onclick=()=>document.getElementById('drawer').classList.remove('open');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.getElementById('recordFilters').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.filter=b.dataset.filter;document.querySelectorAll('#recordFilters button').forEach(x=>x.classList.toggle('on',x===b));applyFilters()};
document.getElementById('search').oninput=e=>{state.query=e.target.value.trim();renderNodes();if(state.query){const first=tables.find(t=>t.name.toLowerCase().includes(state.query.toLowerCase())||t.columns.some(c=>c.name.toLowerCase().includes(state.query.toLowerCase())||c.type.toLowerCase().includes(state.query.toLowerCase())));if(first){state.selected=first.name;updateHighlights()}}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search').focus()}if(e.key==='Escape'){document.getElementById('drawer').classList.remove('open');document.getElementById('search').value='';state.query='';state.selected=null;state.isolated=null;renderNodes()}});
let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.target.closest('.toolbar-float')||e.target.closest('.drawer')||e.target.closest('.zoomhud')||e.target.closest('.minimap'))return;drag={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,sx:state.targetX,sy:state.targetY,last:performance.now(),vx:0,vy:0};viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dt=Math.max(1,now-drag.last),dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.vx=(e.clientX-drag.lastX)/dt;drag.vy=(e.clientY-drag.lastY)/dt;drag.lastX=e.clientX;drag.lastY=e.clientY;drag.last=now;moveCanvas(drag.sx+dx,drag.sy+dy,state.targetScale)});viewport.addEventListener('pointerup',()=>{if(!drag)return;let {vx,vy}=drag;drag=null;viewport.classList.remove('dragging');const coast=()=>{vx*=.91;vy*=.91;if(Math.abs(vx)+Math.abs(vy)<.025)return;moveCanvas(state.targetX+vx*16,state.targetY+vy*16,state.targetScale);requestAnimationFrame(coast)};requestAnimationFrame(coast)});viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(state.targetScale*Math.exp(-e.deltaY*.0015),e.clientX-viewport.getBoundingClientRect().left,e.clientY-viewport.getBoundingClientRect().top)},{passive:false});document.getElementById('minimap').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*380,sy=(e.clientY-r.top)/r.height*244;moveCanvas(viewport.clientWidth/2-sx/.055*state.targetScale,viewport.clientHeight/2-sy/.055*state.targetScale,state.targetScale)};
for(const [id,value] of [['metric-tables',DB.metrics.tableCount],['metric-rows',fmt.format(DB.metrics.recordCount)],['metric-fks',DB.metrics.foreignKeyCount]])document.getElementById(id).textContent=value;document.getElementById('dbmeta').textContent=`${DB.database.toUpperCase()} · MYSQL DUMP`;document.getElementById('topFive').textContent='Top 5 · '+DB.metrics.topTables.map((t,i)=>`${i+1}. ${t.name} ${fmt.format(t.records)}`).join(' · ');const userSelect=document.getElementById('userFilter');for(const u of DB.accessControl.users){const option=document.createElement('option');option.value=u.name;option.textContent=u.name+(u.roles.length?' · '+u.roles.join(', '):'');userSelect.append(option)}userSelect.onchange=e=>{state.userFilter=e.target.value;world.classList.toggle('user-filtered',!!state.userFilter);renderNodes();fit()};renderNodes();transform();setTimeout(fit,80);
</script></body></html>
